<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форматирование текста</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Форматирование текста</h1>
        <div class="input-group">
            <textarea id="inputText" placeholder="Введите текст здесь..."></textarea>
            <textarea id="outputText" readonly placeholder="Здесь будет форматированный текст..."></textarea>
        </div>
        <button id="copyButton">Копировать текст</button>
        <div id="notification" class="notification">Текст скопирован!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
