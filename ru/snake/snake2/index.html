<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Самоиграющая змейка с ИИ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .game-board {
            border: 2px solid #333;
            background-color: #111;
        }
        .controls {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 200px;
        }
        .controls h3 {
            margin-top: 0;
            color: #333;
        }
        .controls button {
            padding: 8px 12px;
            margin: 5px 0;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }
        .controls button:hover {
            background-color: #45a049;
        }
        .stats {
            background-color: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 10px;
            width: 400px;
        }
        .stats h3 {
            margin-top: 0;
            color: #333;
        }
        .slider-container {
            margin: 10px 0;
        }
        .slider-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .slider {
            width: 100%;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-right: 15px;
            margin-bottom: 5px;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            margin-right: 5px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>
    <h1>Самоиграющая змейка с продвинутым ИИ</h1>
    
    <div class="game-container">
        <canvas id="gameCanvas" class="game-board" width="400" height="400"></canvas>
        
        <div class="controls">
            <h3>Управление</h3>
            <button id="startBtn">Запустить</button>
            <button id="pauseBtn">Пауза</button>
            <button id="resetBtn">Сбросить</button>
            
            <div class="slider-container">
                <label for="speedSlider">Скорость: <span id="speedValue">5</span></label>
                <input type="range" id="speedSlider" class="slider" min="1" max="20" value="5">
            </div>
            
            <div class="slider-container">
                <label for="sizeSlider">Размер поля: <span id="sizeValue">20</span>x<span id="sizeValue2">20</span></label>
                <input type="range" id="sizeSlider" class="slider" min="10" max="30" value="20">
            </div>
        </div>
    </div>
    
    <div class="stats">
        <h3>Статистика</h3>
        <p>Текущий счет: <strong id="currentScore">0</strong></p>
        <p>Рекорд: <strong id="highScore">0</strong></p>
        <p>Эффективность пути: <strong id="pathEfficiency">0%</strong></p>
        <p>Режим: <strong id="currentMode">Поиск еды</strong></p>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: green;"></div>
                <span>Голова</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #4CAF50;"></div>
                <span>Тело</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: red;"></div>
                <span>Еда</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: rgba(255, 255, 0, 0.3);"></div>
                <span>Путь</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: rgba(255, 0, 0, 0.2);"></div>
                <span>Опасная зона</span>
            </div>
        </div>
    </div>

    <script>
        // Настройки игры
        const config = {
            gridSize: 20,
            cellSize: 20,
            speed: 5, // кадров в секунду
            lookAhead: 4, // глубина предсказания ходов
        };
        
        // Состояние игры
        let gameState = {
            snake: [], // массив координат сегментов змейки
            direction: { x: 1, y: 0 }, // начальное направление
            food: null,
            score: 0,
            highScore: 0,
            pathEfficiency: 0,
            running: false,
            paused: false,
            gameOver: false,
            currentPath: [], // путь до еды
            dangerZones: [], // опасные зоны
            currentMode: "search", // search или survival
            totalSteps: 0,
            optimalSteps: 0
        };
        
        // Получение элементов управления
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        const sizeValue2 = document.getElementById('sizeValue2');
        const currentScoreElement = document.getElementById('currentScore');
        const highScoreElement = document.getElementById('highScore');
        const pathEfficiencyElement = document.getElementById('pathEfficiency');
        const currentModeElement = document.getElementById('currentMode');
        
        // Направления
        const directions = {
            up: { x: 0, y: -1 },
            down: { x: 0, y: 1 },
            left: { x: -1, y: 0 },
            right: { x: 1, y: 0 }
        };
        
        // Инициализация игры
        function initGame() {
            // Настройка размера canvas
            canvas.width = config.gridSize * config.cellSize;
            canvas.height = config.gridSize * config.cellSize;
            
            // Инициализация змейки в центре сетки
            const centerX = Math.floor(config.gridSize / 2);
            const centerY = Math.floor(config.gridSize / 2);
            gameState.snake = [
                { x: centerX, y: centerY },
                { x: centerX - 1, y: centerY },
                { x: centerX - 2, y: centerY }
            ];
            
            gameState.direction = directions.right;
            gameState.score = 0;
            gameState.totalSteps = 0;
            gameState.optimalSteps = 0;
            gameState.currentPath = [];
            gameState.dangerZones = [];
            gameState.gameOver = false;
            gameState.currentMode = "search";
            
            // Размещение первой еды
            placeFood();
            
            // Обновление статистики
            updateStats();
        }
        
        // Размещение еды на поле
        function placeFood() {
            // Создаем карту доступных клеток (не занятых змейкой)
            const availableCells = [];
            for (let y = 0; y < config.gridSize; y++) {
                for (let x = 0; x < config.gridSize; x++) {
                    const isSnakeCell = gameState.snake.some(segment => segment.x === x && segment.y === y);
                    if (!isSnakeCell) {
                        availableCells.push({ x, y });
                    }
                }
            }
            
            // Если доступные клетки есть, выбираем случайную для еды
            if (availableCells.length > 0) {
                const randomIndex = Math.floor(Math.random() * availableCells.length);
                gameState.food = availableCells[randomIndex];
                
                // Рассчитываем оптимальный путь к еде для статистики
                const head = gameState.snake[0];
                gameState.optimalSteps += Math.abs(head.x - gameState.food.x) + Math.abs(head.y - gameState.food.y);
            } else {
                // Если нет свободных клеток, игрок победил
                gameState.running = false;
                alert("Победа! Вы заполнили все поле!");
            }
        }
        
        // Основной игровой цикл
        function gameLoop() {
            if (!gameState.running || gameState.paused) return;
            
            // Обновление состояния игры
            update();
            
            // Отрисовка игры
            render();
            
            // Планирование следующего кадра
            setTimeout(gameLoop, 1000 / config.speed);
        }
        
        // Обновление состояния игры
        function update() {
            if (gameState.gameOver) return;
            
            // Принятие решения ИИ
            makeAIDecision();
            
            // Перемещение змейки
            const head = { ...gameState.snake[0] };
            const newHead = {
                x: head.x + gameState.direction.x,
                y: head.y + gameState.direction.y
            };
            
            // Проверка на столкновение со стеной
            if (newHead.x < 0 || newHead.x >= config.gridSize || 
                newHead.y < 0 || newHead.y >= config.gridSize) {
                gameState.gameOver = true;
                return;
            }
            
            // Проверка на столкновение с собой
            for (let i = 0; i < gameState.snake.length; i++) {
                if (gameState.snake[i].x === newHead.x && gameState.snake[i].y === newHead.y) {
                    gameState.gameOver = true;
                    return;
                }
            }
            
            // Добавление новой головы
            gameState.snake.unshift(newHead);
            
            // Проверка на поедание еды
            if (newHead.x === gameState.food.x && newHead.y === gameState.food.y) {
                // Увеличиваем счет
                gameState.score++;
                if (gameState.score > gameState.highScore) {
                    gameState.highScore = gameState.score;
                }
                
                // Размещаем новую еду
                placeFood();
                
                // Пересчитываем путь
                calculatePath();
            } else {
                // Если еду не съели, удаляем последний сегмент змейки
                gameState.snake.pop();
            }
            
            // Увеличиваем счетчик шагов
            gameState.totalSteps++;
            
            // Обновление статистики
            updateStats();
        }
        
        // Принятие решения ИИ
        function makeAIDecision() {
            const head = gameState.snake[0];
            
            // Пересчитываем путь, если он пуст или если мы в режиме выживания
            if (gameState.currentPath.length === 0 || gameState.currentMode === "survival") {
                calculatePath();
            }
            
            // Если есть путь, следуем по нему
            if (gameState.currentPath.length > 0) {
                const nextStep = gameState.currentPath[0];
                
                // Определение направления к следующей точке
                if (nextStep.x > head.x) {
                    gameState.direction = directions.right;
                } else if (nextStep.x < head.x) {
                    gameState.direction = directions.left;
                } else if (nextStep.y > head.y) {
                    gameState.direction = directions.down;
                } else if (nextStep.y < head.y) {
                    gameState.direction = directions.up;
                }
                
                // Удаляем текущий шаг из пути
                gameState.currentPath.shift();
            }
        }
        
        // Расчет пути с использованием A* алгоритма
        function calculatePath() {
            const head = gameState.snake[0];
            const food = gameState.food;
            
            // Проверка на тупики и потенциально опасные ситуации
            const safePathToFood = findPathAStar(head, food);
            
            // Если путь к еде существует и безопасен, используем его
            if (safePathToFood && isSafePath(safePathToFood)) {
                gameState.currentPath = safePathToFood;
                gameState.currentMode = "search";
                currentModeElement.textContent = "Поиск еды";
            } else {
                // Режим выживания: ищем путь к самой дальней безопасной клетке
                const survivalPath = findSurvivalPath();
                if (survivalPath && survivalPath.length > 0) {
                    gameState.currentPath = survivalPath;
                    gameState.currentMode = "survival";
                    currentModeElement.textContent = "Выживание";
                } else {
                    // Если выживание невозможно, выбираем любое доступное направление
                    gameState.currentPath = findAnyValidMove();
                    gameState.currentMode = "desperate";
                    currentModeElement.textContent = "Отчаянное движение";
                }
            }
            
            // Обновляем опасные зоны
            updateDangerZones();
        }
        
        // Определение опасных зон (где змейка может застрять)
        function updateDangerZones() {
            gameState.dangerZones = [];
            
            // Для каждой свободной клетки проверяем, может ли змейка выбраться из нее
            for (let y = 0; y < config.gridSize; y++) {
                for (let x = 0; x < config.gridSize; x++) {
                    // Пропускаем клетки, занятые змейкой
                    const isSnakeCell = gameState.snake.some(segment => segment.x === x && segment.y === y);
                    if (isSnakeCell) continue;
                    
                    // Пропускаем клетку с едой
                    if (gameState.food && gameState.food.x === x && gameState.food.y === y) continue;
                    
                    // Проверка на тупик
                    const cell = { x, y };
                    const isTrapped = isDeadEnd(cell);
                    if (isTrapped) {
                        gameState.dangerZones.push(cell);
                    }
                }
            }
        }
        
        // Проверка клетки на тупик
        function isDeadEnd(cell) {
            // Считаем количество свободных соседей
            let freeNeighbors = 0;
            
            // Проверяем все 4 направления
            for (const dir of Object.values(directions)) {
                const neighbor = { x: cell.x + dir.x, y: cell.y + dir.y };
                
                // Проверяем, что сосед в пределах поля
                if (neighbor.x < 0 || neighbor.x >= config.gridSize || 
                    neighbor.y < 0 || neighbor.y >= config.gridSize) {
                    continue;
                }
                
                // Проверяем, что сосед не занят змейкой
                const isSnakeCell = gameState.snake.some(segment => segment.x === neighbor.x && segment.y === neighbor.y);
                if (!isSnakeCell) {
                    freeNeighbors++;
                }
            }
            
            // Если менее 2 свободных соседей, это может быть тупик
            return freeNeighbors < 2;
        }
        
        // Проверка безопасности пути (симуляция)
        function isSafePath(path) {
            // Создаем копию текущего состояния для симуляции
            const simulatedSnake = gameState.snake.map(segment => ({ ...segment }));
            
            // Симулируем движение по пути
            for (const step of path) {
                // Добавляем новую голову
                simulatedSnake.unshift({ ...step });
                
                // Если это не последний шаг (не еда), удаляем хвост
                if (!(step.x === gameState.food.x && step.y === gameState.food.y)) {
                    simulatedSnake.pop();
                }
                
                // Проверяем, есть ли после этого шага выход
                // (нам нужно минимум два выхода после съедания еды из-за роста)
                if (step.x === gameState.food.x && step.y === gameState.food.y) {
                    const head = simulatedSnake[0];
                    let exits = 0;
                    
                    for (const dir of Object.values(directions)) {
                        const neighbor = { x: head.x + dir.x, y: head.y + dir.y };
                        
                        // Проверяем, что сосед в пределах поля
                        if (neighbor.x < 0 || neighbor.x >= config.gridSize || 
                            neighbor.y < 0 || neighbor.y >= config.gridSize) {
                            continue;
                        }
                        
                        // Проверяем, что сосед не занят змейкой
                        const isSnakeCell = simulatedSnake.some(
                            segment => segment.x === neighbor.x && segment.y === neighbor.y
                        );
                        if (!isSnakeCell) {
                            exits++;
                        }
                    }
                    
                    // После съедания еды нам нужен хотя бы один выход
                    if (exits < 1) {
                        return false;
                    }
                }
            }
            
            return true;
        }
        
        // A* алгоритм поиска пути
        function findPathAStar(start, end) {
            // Множество посещенных узлов
            const closedSet = new Set();
            // Очередь узлов для посещения (отсортированная по f-значению)
            const openSet = [{ 
                x: start.x, 
                y: start.y, 
                g: 0, 
                h: manhattan(start, end),
                f: manhattan(start, end),
                parent: null 
            }];
            
            // Пока есть узлы для исследования
            while (openSet.length > 0) {
                // Сортируем по f-значению и выбираем лучший узел
                openSet.sort((a, b) => a.f - b.f);
                const current = openSet.shift();
                
                // Если достигли цели, восстанавливаем путь
                if (current.x === end.x && current.y === end.y) {
                    return reconstructPath(current);
                }
                
                // Добавляем в посещенные
                closedSet.add(`${current.x},${current.y}`);
                
                // Проверяем все соседние клетки
                for (const dir of Object.values(directions)) {
                    const neighbor = { 
                        x: current.x + dir.x, 
                        y: current.y + dir.y,
                        parent: current 
                    };
                    
                    // Пропускаем, если вне поля
                    if (neighbor.x < 0 || neighbor.x >= config.gridSize || 
                        neighbor.y < 0 || neighbor.y >= config.gridSize) {
                        continue;
                    }
                    
                    // Пропускаем посещенные
                    if (closedSet.has(`${neighbor.x},${neighbor.y}`)) {
                        continue;
                    }
                    
                    // Пропускаем клетки, занятые змейкой (кроме хвоста, который может двигаться)
                    const isSnakeSegment = gameState.snake.some((segment, index) => {
                        // Хвост может двигаться, если не съедаем еду
                        if (index === gameState.snake.length - 1 && 
                            !(current.x === end.x && current.y === end.y)) {
                            return false;
                        }
                        return segment.x === neighbor.x && segment.y === neighbor.y;
                    });
                    
                    if (isSnakeSegment) {
                        continue;
                    }
                    
                    // Вычисляем значение g (стоимость от старта)
                    const g = current.g + 1;
                    
                    // Вычисляем эвристику (расстояние до цели)
                    const h = manhattan(neighbor, end);
                    
                    // Дополнительный штраф за опасные зоны
                    let dangerPenalty = 0;
                    if (gameState.dangerZones.some(zone => zone.x === neighbor.x && zone.y === neighbor.y)) {
                        dangerPenalty = 10; // Сильный штраф за опасные зоны
                    }
                    
                    // Общая оценка узла
                    const f = g + h + dangerPenalty;
                    
                    // Добавляем соседа в openSet с вычисленными значениями
                    neighbor.g = g;
                    neighbor.h = h;
                    neighbor.f = f;
                    
                    // Ищем узел в openSet с такими же координатами
                    const openNode = openSet.find(node => node.x === neighbor.x && node.y === neighbor.y);
                    if (!openNode) {
                        // Если узел не в openSet, добавляем его
                        openSet.push(neighbor);
                    } else if (g < openNode.g) {
                        // Если нашли лучший путь к узлу, обновляем значения
                        openNode.g = g;
                        openNode.f = f;
                        openNode.parent = current;
                    }
                }
            }
            
            // Если путь не найден, возвращаем null
            return null;
        }
        
        // Поиск пути для выживания (к самой дальней безопасной клетке)
        function findSurvivalPath() {
            const head = gameState.snake[0];
            let bestCell = null;
            let bestDistance = -1;
            
            // Ищем самую дальнюю безопасную клетку
            for (let y = 0; y < config.gridSize; y++) {
                for (let x = 0; x < config.gridSize; x++) {
                    // Пропускаем клетки, занятые змейкой
                    const isSnakeCell = gameState.snake.some(segment => segment.x === x && segment.y === y);
                    if (isSnakeCell) continue;
                    
                    // Пропускаем опасные зоны
                    const isDangerZone = gameState.dangerZones.some(zone => zone.x === x && zone.y === y);
                    if (isDangerZone) continue;
                    
                    // Вычисляем дистанцию
                    const distance = manhattan(head, { x, y });
                    
                    // Если клетка дальше, выбираем ее
                    if (distance > bestDistance) {
                        // Проверяем, есть ли путь к этой клетке
                        const path = findPathAStar(head, { x, y });
                        if (path) {
                            bestDistance = distance;
                            bestCell = { x, y };
                        }
                    }
                }
            }
            
            // Если нашли подходящую клетку, строим путь к ней
            if (bestCell) {
                return findPathAStar(head, bestCell);
            }
            
            return null;
        }
        
        // Поиск любого валидного движения (когда все плохо)
        function findAnyValidMove() {
            const head = gameState.snake[0];
            
            // Пытаемся найти любое валидное направление
            for (const dir of Object.values(directions)) {
                const nextPos = { x: head.x + dir.x, y: head.y + dir.y };
                
                // Проверка на выход за границы
                if (nextPos.x < 0 || nextPos.x >= config.gridSize || 
                    nextPos.y < 0 || nextPos.y >= config.gridSize) {
                    continue;
                }
                
                // Проверка на столкновение с самим собой
                const isSelfCollision = gameState.snake.some(segment => 
                    segment.x === nextPos.x && segment.y === nextPos.y
                );
                
                if (!isSelfCollision) {
                    return [nextPos];
                }
            }
            
            // Если нет валидных ходов, возвращаем пустой путь
            return [];
        }
        
        // Восстановление пути из конечного узла
        function reconstructPath(node) {
            const path = [];
            let current = node;
            
            while (current.parent) {
                path.unshift({ x: current.x, y: current.y });
                current = current.parent;
            }
            
            return path;
        }
        
        // Манхэттенское расстояние между двумя точками
        function manhattan(a, b) {
            return Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
        }
        
        // Обновление статистики
        function updateStats() {
            currentScoreElement.textContent = gameState.score;
            highScoreElement.textContent = gameState.highScore;
            
            // Обновляем эффективность пути
            if (gameState.totalSteps > 0 && gameState.optimalSteps > 0) {
                const efficiency = Math.min(100, Math.round((gameState.optimalSteps / gameState.totalSteps) * 100));
                gameState.pathEfficiency = efficiency;
                pathEfficiencyElement.textContent = efficiency + "%";
            } else {
                pathEfficiencyElement.textContent = "0%";
            }
        }
        
        // Отрисовка игры
        function render() {
            // Очистка холста
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка сетки
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= config.gridSize; i++) {
                // Вертикальные линии
                ctx.beginPath();
                ctx.moveTo(i * config.cellSize, 0);
                ctx.lineTo(i * config.cellSize, canvas.height);
                ctx.stroke();
                
                // Горизонтальные линии
                ctx.beginPath();
                ctx.moveTo(0, i * config.cellSize);
                ctx.lineTo(canvas.width, i * config.cellSize);
                ctx.stroke();
            }
            
            // Отрисовка опасных зон
            ctx.fillStyle = 'rgba(255, 0, 0, 0.2)';
            for (const zone of gameState.dangerZones) {
                ctx.fillRect(
                    zone.x * config.cellSize, 
                    zone.y * config.cellSize, 
                    config.cellSize, 
                    config.cellSize
                );
            }
            
            // Отрисовка пути
            ctx.fillStyle = 'rgba(255, 255, 0, 0.3)';
            for (const step of gameState.currentPath) {
                ctx.fillRect(
                    step.x * config.cellSize, 
                    step.y * config.cellSize, 
                    config.cellSize, 
                    config.cellSize
                );
            }
            
            // Отрисовка еды
            if (gameState.food) {
                ctx.fillStyle = 'red';
                ctx.beginPath();
                ctx.arc(
                    gameState.food.x * config.cellSize + config.cellSize / 2, 
                    gameState.food.y * config.cellSize + config.cellSize / 2, 
                    config.cellSize / 2 - 2, 
                    0, 
                    Math.PI * 2
                );
                ctx.fill();
            }
            
            // Отрисовка змейки
            for (let i = 0; i < gameState.snake.length; i++) {
                const segment = gameState.snake[i];
                if (i === 0) {
                    // Отрисовка головы (зеленая)
                    ctx.fillStyle = 'green';
                } else {
                    // Отрисовка тела (светло-зеленая)
                    ctx.fillStyle = '#4CAF50';
                }
                
                ctx.fillRect(
                    segment.x * config.cellSize, 
                    segment.y * config.cellSize, 
                    config.cellSize, 
                    config.cellSize
                );
            }
            
            // Отрисовка сообщения о конце игры
            if (gameState.gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.font = '24px Arial';
                ctx.fillStyle = 'white';
                ctx.textAlign = 'center';
                ctx.fillText('ИГРА ОКОНЧЕНА', canvas.width / 2, canvas.height / 2);
                ctx.font = '16px Arial';
                ctx.fillText(`Счет: ${gameState.score}`, canvas.width / 2, canvas.height / 2 + 30);
                ctx.fillText('Нажмите "Сбросить" для новой игры', canvas.width / 2, canvas.height / 2 + 60);
            }
        }
        
        // Обработчики событий для кнопок и слайдеров
        startBtn.addEventListener('click', () => {
            if (!gameState.running && !gameState.gameOver) {
                gameState.running = true;
                gameState.paused = false;
                gameLoop();
            }
        });
        
        pauseBtn.addEventListener('click', () => {
            if (gameState.running) {
                gameState.paused = !gameState.paused;
                if (!gameState.paused) {
                    gameLoop();
                }
            }
        });
        
        resetBtn.addEventListener('click', () => {
            config.gridSize = parseInt(sizeSlider.value);
            config.speed = parseInt(speedSlider.value);
            
            canvas.width = config.gridSize * config.cellSize;
            canvas.height = config.gridSize * config.cellSize;
            
            initGame();
            
            gameState.paused = false;
            gameState.running = false;
            gameState.gameOver = false;
            
            render();
        });
        
        speedSlider.addEventListener('input', () => {
            config.speed = parseInt(speedSlider.value);
            speedValue.textContent = config.speed;
        });
        
        sizeSlider.addEventListener('input', () => {
            const size = parseInt(sizeSlider.value);
            sizeValue.textContent = size;
            sizeValue2.textContent = size;
        });
        
        // Инициализация и начальная отрисовка
        initGame();
        render();
    </script>
</body>
</html>
