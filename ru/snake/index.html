<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Улучшенная змейка с настройками</title>
  <style>
    body {
      margin: 0;
      background: #222;
      color: #eee;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
    }
    #controls {
      margin-bottom: 10px;
    }
    canvas {
      background: #333;
      border: 2px solid #555;
    }
  </style>
</head>
<body>
  <div id="controls">
    Размер поля: ширина: 
    <input id="fieldWidth" type="number" value="400" min="200" max="800">,
    высота: 
    <input id="fieldHeight" type="number" value="400" min="200" max="800">
    <button id="applySize">Применить</button>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    // Параметры, которые можно менять
    let fieldWidth = 400;
    let fieldHeight = 400;
    const cellSize = 20; // размер одной клетки
    let cols = fieldWidth / cellSize;
    let rows = fieldHeight / cellSize;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // Инициализация змейки и яблока
    let snake = [ { x: Math.floor(cols/2), y: Math.floor(rows/2) } ];
    let apple = getRandomApple();

    // Интервал обновления игры (мс)
    const interval = 100;
    // Глубина поиска Minimax
    const maxDepth = 3;

    // Обновление настроек поля
    document.getElementById('applySize').addEventListener('click', () => {
      fieldWidth = parseInt(document.getElementById('fieldWidth').value);
      fieldHeight = parseInt(document.getElementById('fieldHeight').value);
      canvas.width = fieldWidth;
      canvas.height = fieldHeight;
      cols = Math.floor(fieldWidth / cellSize);
      rows = Math.floor(fieldHeight / cellSize);
      resetGame();
    });

    // Основной цикл игры
    function gameLoop() {
      let bestMove = getBestMove();
      if (bestMove) {
        moveSnake(bestMove);
      } else {
        // Если нет подходящего хода — игра окончена, перезапуск
        resetGame();
      }
      draw();
    }

    // Получить список всех возможных направлений (вверх, вправо, вниз, влево)
    function getPossibleMoves(head) {
      return [
        { x: 0, y: -1 },
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: -1, y: 0 }
      ].filter(dir => {
        let newHead = { x: head.x + dir.x, y: head.y + dir.y };
        return isValid(newHead, snake);
      });
    }

    // Функция выбора лучшего хода с помощью Minimax
    function getBestMove() {
      let moves = getPossibleMoves(snake[0]);
      if (moves.length === 0) return null;
      let bestScore = -Infinity;
      let bestMove = null;
      for (let move of moves) {
        let simulatedSnake = simulateMove(snake, move);
        let score = minimax(simulatedSnake, maxDepth - 1, false);
        if (score > bestScore) {
          bestScore = score;
          bestMove = move;
        }
      }
      return bestMove;
    }

    // Реализация Minimax
    function minimax(simSnake, depth, isMaximizing) {
      if (depth === 0 || gameOver(simSnake)) {
        return evaluateState(simSnake);
      }
      let head = simSnake[0];
      let moves = getPossibleMoves(head);
      if (moves.length === 0) return evaluateState(simSnake);

      if (isMaximizing) {
        let maxEval = -Infinity;
        for (let move of moves) {
          let newSim = simulateMove(simSnake, move);
          let evalScore = minimax(newSim, depth - 1, false);
          maxEval = Math.max(maxEval, evalScore);
        }
        return maxEval;
      } else {
        let minEval = Infinity;
        for (let move of moves) {
          let newSim = simulateMove(simSnake, move);
          let evalScore = minimax(newSim, depth - 1, true);
          minEval = Math.min(minEval, evalScore);
        }
        return minEval;
      }
    }

    // Оценочная функция: расстояние до яблока и свободное пространство
    function evaluateState(simSnake) {
      let head = simSnake[0];
      let dist = Math.abs(head.x - apple.x) + Math.abs(head.y - apple.y);
      let free = floodFillCount(head, simSnake);
      return free - dist * 2;
    }

    // Симуляция движения змейки для Minimax
    function simulateMove(snakeState, move) {
      let newSnake = JSON.parse(JSON.stringify(snakeState));
      let newHead = { x: newSnake[0].x + move.x, y: newSnake[0].y + move.y };
      newSnake.unshift(newHead);
      if (newHead.x === apple.x && newHead.y === apple.y) {
        // Если яблоко съедено, змейка растёт – для симуляции оставляем яблоко как есть
      } else {
        newSnake.pop();
      }
      return newSnake;
    }

    // Проверка корректности клетки
    function isValid(point, snakeState) {
      if (point.x < 0 || point.x >= cols || point.y < 0 || point.y >= rows) return false;
      return !snakeState.some(s => s.x === point.x && s.y === point.y);
    }

    // Завершение игры – если нет ходов
    function gameOver(snakeState) {
      return getPossibleMoves(snakeState[0]).length === 0;
    }

    // Подсчёт достижимых клеток (flood fill)
    function floodFillCount(start, snakeState) {
      let visited = Array.from({length: rows}, () => Array(cols).fill(false));
      snakeState.forEach(s => { visited[s.y][s.x] = true; });
      let count = 0;
      let queue = [start];
      while (queue.length) {
        let p = queue.shift();
        count++;
        const directions = [
          { x: 0, y: -1 },
          { x: 1, y: 0 },
          { x: 0, y: 1 },
          { x: -1, y: 0 }
        ];
        for (let d of directions) {
          let np = { x: p.x + d.x, y: p.y + d.y };
          if (np.x < 0 || np.x >= cols || np.y < 0 || np.y >= rows) continue;
          if (visited[np.y][np.x]) continue;
          visited[np.y][np.x] = true;
          queue.push(np);
        }
      }
      return count;
    }

    // Основное движение змейки
    function moveSnake(dir) {
      let newHead = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (!isValid(newHead, snake)) {
        resetGame();
        return;
      }
      snake.unshift(newHead);
      if (newHead.x === apple.x && newHead.y === apple.y) {
        apple = getRandomApple();
      } else {
        snake.pop();
      }
    }

    // Перезапуск игры
    function resetGame() {
      snake = [ { x: Math.floor(cols/2), y: Math.floor(rows/2) } ];
      apple = getRandomApple();
    }

    // Получение случайного яблока, не занятого змейкой
    function getRandomApple() {
      let pos;
      do {
        pos = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
      } while (snake.some(s => s.x === pos.x && s.y === pos.y));
      return pos;
    }

    // Функция отрисовки игрового поля, сетки, яблока и змейки
    function draw() {
      // Очистка поля
      ctx.fillStyle = "#333";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // Рисуем сетку
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      for (let i = 0; i <= cols; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, rows * cellSize);
        ctx.stroke();
      }
      for (let j = 0; j <= rows; j++) {
        ctx.beginPath();
        ctx.moveTo(0, j * cellSize);
        ctx.lineTo(cols * cellSize, j * cellSize);
        ctx.stroke();
      }
      
      // Рисуем яблоко
      ctx.fillStyle = "red";
      ctx.fillRect(apple.x * cellSize, apple.y * cellSize, cellSize, cellSize);
      
      // Рисуем змейку
      for (let i = 0; i < snake.length; i++) {
        let s = snake[i];
        // Основной цвет змейки
        ctx.fillStyle = "lime";
        ctx.fillRect(s.x * cellSize, s.y * cellSize, cellSize, cellSize);
        // Обводка сегмента
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.strokeRect(s.x * cellSize, s.y * cellSize, cellSize, cellSize);
      }
      
      // Рисуем глазки на голове змейки
      drawEyes();
    }

    // Функция отрисовки глаз на голове змейки
    function drawEyes() {
      if (snake.length === 0) return;
      let head = snake[0];
      let centerX = head.x * cellSize;
      let centerY = head.y * cellSize;
      // Определяем направление движения по разнице между головой и вторым сегментом.
      let dx = 0, dy = 0;
      if (snake.length > 1) {
        dx = head.x - snake[1].x;
        dy = head.y - snake[1].y;
      }
      // По умолчанию смотрят вправо, если не определено
      if (dx === 0 && dy === 0) { dx = 1; }
      
      // Настраиваем положение глаз в зависимости от направления
      let eyeOffsetX = 0, eyeOffsetY = 0;
      if (dx === 1) { // двигаемся вправо
        eyeOffsetX = cellSize * 0.2;
        eyeOffsetY = cellSize * 0.2;
      } else if (dx === -1) { // влево
        eyeOffsetX = cellSize * 0.8;
        eyeOffsetY = cellSize * 0.2;
      } else if (dy === 1) { // вниз
        eyeOffsetX = cellSize * 0.2;
        eyeOffsetY = cellSize * 0.2;
      } else if (dy === -1) { // вверх
        eyeOffsetX = cellSize * 0.2;
        eyeOffsetY = cellSize * 0.8;
      }
      
      // Рисуем два глаза
      ctx.fillStyle = "#000";
      // Первый глаз
      ctx.beginPath();
      ctx.arc(centerX + eyeOffsetX, centerY + eyeOffsetY, cellSize * 0.1, 0, Math.PI * 2);
      ctx.fill();
      // Второй глаз (зеркальное смещение по горизонтали)
      ctx.beginPath();
      ctx.arc(centerX + (cellSize - eyeOffsetX), centerY + eyeOffsetY, cellSize * 0.1, 0, Math.PI * 2);
      ctx.fill();
    }

    // Запуск основного цикла игры
    setInterval(gameLoop, interval);
  </script>
</body>
</html>
